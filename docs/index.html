<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Now Playing Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --spotify-green: #1DB954;
  --spotify-glow: rgba(29, 185, 84, 0.35);
  --card-bg: rgba(13, 15, 22, 0.84);
  --border-color: rgba(255, 255, 255, 0.12);
  --text-main: #ffffff;
  --text-sub: #9ca3af;
  --text-muted: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 10px;
}

/* Ambient backlight glow matching album cover */
.ambient-glow {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 120px;
  height: 100px;
  border-radius: 50%;
  filter: blur(45px);
  opacity: 0.6;
  z-index: 0;
  pointer-events: none;
  transition: all 0.8s ease;
  transform: scale(1.1);
}

/* Main glassmorphism player card */
.player-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 580px;
  min-height: 114px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  border-radius: 20px;
  background: var(--card-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border-color);
  box-shadow: 
    0 20px 40px -15px rgba(0, 0, 0, 0.85),
    0 0 1px 1px rgba(255, 255, 255, 0.08),
    inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}

.player-card.is-playing {
  border-color: rgba(29, 185, 84, 0.3);
  box-shadow: 
    0 20px 45px -15px rgba(0, 0, 0, 0.85),
    0 0 25px -5px var(--spotify-glow),
    inset 0 1px 0 0 rgba(255, 255, 255, 0.18);
}

/* Album Art container with subtle glossy border */
.art-wrapper {
  position: relative;
  width: 86px;
  height: 86px;
  flex: 0 0 86px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #18181b;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

.player-card.is-playing .art-img {
  transform: scale(1.02);
}

/* Subtle corner gloss over cover */
.art-wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
  pointer-events: none;
}

/* Details container */
.details {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Header badge row */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}

.spotify-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-sub);
  text-transform: uppercase;
}

.spotify-icon {
  width: 15px;
  height: 15px;
  fill: var(--spotify-green);
  filter: drop-shadow(0 0 6px var(--spotify-glow));
}

/* Cool animated Equalizer sound bars */
.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 2.5px;
  height: 12px;
}

.eq-bar {
  width: 2.5px;
  background: var(--spotify-green);
  border-radius: 2px;
  height: 3px;
  transition: height 0.2s ease;
}

.is-playing .eq-bar {
  animation: eqBounce 1s ease-in-out infinite alternate;
}

.is-playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.is-playing .eq-bar:nth-child(2) { animation-delay: 0.35s; }
.is-playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.is-playing .eq-bar:nth-child(4) { animation-delay: 0.45s; }

@keyframes eqBounce {
  0% { height: 3px; }
  100% { height: 12px; }
}

/* Typography */
.title {
  color: var(--text-main);
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
}

.artist {
  color: var(--text-sub);
  font-size: 13.5px;
  font-weight: 500;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}

.artist .album-name {
  color: var(--text-muted);
  font-weight: 400;
}

/* Progress bar section */
.progress-section {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.time-label {
  font-size: 10.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  min-width: 28px;
}

.track-bar {
  position: relative;
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  overflow: visible;
}

.fill-bar {
  position: relative;
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #1DB954 0%, #1ed760 100%);
  border-radius: 10px;
  box-shadow: 0 0 10px var(--spotify-glow);
  transition: width 0.25s linear;
}

/* Glowing thumb pill at the end of progress */
.fill-bar::after {
  content: "";
  position: absolute;
  right: -3px;
  top: -2.5px;
  width: 9px;
  height: 9px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(30, 215, 96, 0.9), 0 0 2px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.is-playing .fill-bar::after {
  opacity: 1;
}

/* Live pill badge */
.status-pill {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.is-playing .status-pill {
  color: #1ed760;
  background: rgba(29, 185, 84, 0.12);
  border-color: rgba(29, 185, 84, 0.25);
}

@media (max-width: 440px) {
  .player-card {
    gap: 12px;
    padding: 12px 14px;
    min-height: 98px;
  }
  .art-wrapper {
    width: 72px;
    height: 72px;
    flex-basis: 72px;
  }
  .title {
    font-size: 16px;
  }
  .artist {
    font-size: 12px;
  }
}
</style>
</head>
<body>

<!-- Ambient colored backlight glow -->
<img id="ambientGlow" class="ambient-glow" src="./static/placeholder.svg" alt="" aria-hidden="true">

<div id="playerCard" class="player-card">
  <!-- Album Art with glass highlight -->
  <div class="art-wrapper">
    <img id="art" class="art-img" src="./static/placeholder.svg" alt="Album Cover">
  </div>

  <!-- Music Details -->
  <div class="details">
    <div class="header-row">
      <div class="spotify-badge">
        <svg class="spotify-icon" viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.306c-.216.353-.676.467-1.029.25-2.822-1.724-6.375-2.114-10.558-1.158-.403.093-.807-.16-.9-.564-.093-.404.16-.807.564-.9 4.582-1.047 8.513-.6 11.673 1.343.353.216.467.676.25 1.029zm1.47-3.262c-.272.443-.854.583-1.297.311-3.23-1.985-8.155-2.56-11.977-1.401-.497.151-1.025-.133-1.176-.63-.151-.498.133-1.025.63-1.177 4.372-1.326 9.8-0.686 13.51 1.599.442.272.582.855.31 1.298zm.129-3.393c-3.874-2.3-10.264-2.513-13.978-1.385-.595.181-1.229-.158-1.41-.753-.181-.595.158-1.229.753-1.41 4.269-1.296 11.32-1.044 15.79 1.61.536.318.712 1.012.394 1.548-.318.536-1.012.712-1.549.394z"/>
        </svg>
        <span>Now Playing</span>
      </div>
      
      <!-- Live Equalizer Bars -->
      <div class="equalizer" id="equalizer" title="Equalizer">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
    </div>

    <!-- Song title & Artist -->
    <div id="title" class="title">Waiting for Spotify…</div>
    <div id="artist" class="artist">
      <span id="artistName">Play a track on your PC</span>
      <span id="albumSeparator" style="display:none">•</span>
      <span id="albumName" class="album-name"></span>
    </div>

    <!-- Modern progress bar -->
    <div class="progress-section">
      <span id="elapsed" class="time-label">0:00</span>
      <div class="track-bar">
        <div id="fill" class="fill-bar"></div>
      </div>
      <span id="total" class="time-label">0:00</span>
      <span id="statusPill" class="status-pill">OFFLINE</span>
    </div>
  </div>
</div>

<script>
let latest = { position: 0, duration: 0, updated: Date.now() / 1000, playing: false };

function fmt(seconds) {
  seconds = Math.max(0, Math.floor(seconds || 0));
  const m = Math.floor(seconds / 60);
  const s = String(seconds % 60).padStart(2, "0");
  return `${m}:${s}`;
}

async function refresh() {
  try {
    const res = await fetch("./now-playing.json", { cache: "no-store" });
    const data = await res.json();
    
    // Title
    document.getElementById("title").textContent = data.title || "Nothing playing";
    
    // Artist & Album
    const artistElem = document.getElementById("artistName");
    const albumElem = document.getElementById("albumName");
    const albumSep = document.getElementById("albumSeparator");
    
    artistElem.textContent = data.artist || "Start Spotify on your PC";
    if (data.album && data.album !== data.title) {
      albumElem.textContent = data.album;
      albumSep.style.display = "inline";
    } else {
      albumElem.textContent = "";
      albumSep.style.display = "none";
    }

    // Cover art & Ambient backlight
    const art = document.getElementById("art");
    const ambient = document.getElementById("ambientGlow");
    if (data.art_url && art.getAttribute("src") !== data.art_url) {
      art.src = data.art_url;
      ambient.src = data.art_url;
    }

    latest = {
      position: data.position || 0,
      duration: data.duration || 0,
      updated: data.updated || Date.now() / 1000,
      playing: !!data.playing
    };

    // Card playing styling & Equalizer animation state
    const card = document.getElementById("playerCard");
    const statusPill = document.getElementById("statusPill");

    if (data.playing) {
      card.classList.add("is-playing");
      statusPill.textContent = "PLAYING";
    } else {
      card.classList.remove("is-playing");
      statusPill.textContent = data.available ? "PAUSED" : "IDLE";
    }

    document.getElementById("total").textContent = fmt(latest.duration);
  } catch (err) {
    document.getElementById("statusPill").textContent = "OFFLINE";
    document.getElementById("playerCard").classList.remove("is-playing");
  }
}

function tick() {
  let cur = latest.position;
  if (latest.playing) {
    cur += Math.max(0, Date.now() / 1000 - latest.updated);
  }
  cur = Math.min(cur, latest.duration || cur);
  document.getElementById("elapsed").textContent = fmt(cur);

  const pct = latest.duration ? (100 * cur / latest.duration) : 0;
  document.getElementById("fill").style.width = Math.min(100, Math.max(0, pct)) + "%";
}

refresh();
setInterval(refresh, 1400);
setInterval(tick, 200);
</script>
</body>
</html>
